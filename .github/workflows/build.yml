name: Build Lyrics Cord

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Find built JAR
        id: find-jar
        run: |
          JAR_PATH=$(find . -name "lyrics-cord-*.jar" -path "*/build/libs/*" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "JAR not found!"
            find . -name "*.jar" -path "*/build/*"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found JAR at: $JAR_PATH"

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-cord-${{ github.sha }}
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-jar.outputs.jar_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
