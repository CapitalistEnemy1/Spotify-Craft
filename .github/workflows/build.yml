name: Build Lyrics Cord

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        id: gradle_build
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle-build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"

      - name: Show Gradle failure details
        if: failure() && steps.gradle_build.outcome == 'failure'
        run: |
          echo "::group::Gradle build log (last 200 lines)"
          tail -n 200 gradle-build.log
          echo "::endgroup::"
          tail -n 30 gradle-build.log | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done

      - name: Show Gradle build summary (always)
        if: always()
        run: |
          echo "::group::Gradle build log tail"
          tail -n 60 gradle-build.log || true
          echo "::endgroup::"
          grep -E '^> Task |BUILD SUCCESSFUL|BUILD FAILED' gradle-build.log | head -n 30 | while IFS= read -r line; do
            printf '::notice::%s\n' "$line"
          done
          echo "::group::build/ directory tree"
          find . -path '*/build/*' -not -path '*/.gradle/*' | sort
          echo "::endgroup::"
          find . -path '*/build/*' -not -path '*/.gradle/*' | sort | head -n 20 | while IFS= read -r line; do
            printf '::notice::tree: %s\n' "$line"
          done

      - name: Find built JAR
        id: find-jar
        run: |
          JAR_PATH=$(find . -name "lyrics-cord-*.jar" -path "*/build/libs/*" | head -1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::JAR not found! Searched for lyrics-cord-*.jar under */build/libs/*"
            find . -name "*.jar" -path "*/build/*" | while IFS= read -r f; do
              printf '::error::found instead: %s\n' "$f"
            done
            find . -path "*/build/libs" -maxdepth 4 | while IFS= read -r d; do
              printf '::error::build/libs dir: %s (contents: %s)\n' "$d" "$(ls -1 "$d" 2>/dev/null | tr '\n' ',')"
            done
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found JAR at: $JAR_PATH"

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-cord-${{ github.sha }}
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-jar.outputs.jar_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
