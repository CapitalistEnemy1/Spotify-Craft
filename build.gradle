plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'java'
}

group = 'dev.neonlyrics'
version = '2.1.0+mc1.21.11'
archivesBaseName = 'spotify-craft'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.neoforged.net/releases' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1'
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    // Add fabric-api when needed (version format: 0.x.y+1.21.11)
    // modApi 'net.fabricmc.fabric-api:fabric-api:0.112.0+1.21.11'
    // include 'net.fabricmc.fabric-api:fabric-api:0.112.0+1.21.11'
}

loom {
    // Access widener is auto-detected from META-INF/neonlyrics.accesswidener
}

jar {
    manifest {
        attributes(
            'Fabric-Mod-Language': 'java',
            'Fabric-Mod-Loader': 'fabric-loader',
            'Fabric-Mod-Entrypoints': '{"client":["dev.neonlyrics.NeonLyrics"]}',
            'Fabric-Mod-Mixin': 'neonlyrics.mixins.json',
            'Fabric-Mod-AccessWidener': 'neonlyrics.accesswidener'
        )
    }

    // Include fabric.mod.json in the JAR
    from('src/main/resources') {
        include 'fabric.mod.json'
        include 'neonlyrics.mixins.json'
        include 'neonlyrics.accesswidener'
        into 'META-INF'
    }

    // Include assets
    from('src/main/resources/assets') {
        into 'assets'
    }
}

tasks.named('jar') {
    dependsOn tasks.named('processResources')
}

tasks.named('build') {
    dependsOn tasks.named('jar')
}

// Task to help with remapping intermediary -> mojang names
// Run: ./gradlew remapSources
tasks.register('remapSources') {
    doLast {
        println 'To remap decompiled source from intermediary to mojang names:'
        println '1. The decompiled source uses intermediary mappings (class_310, class_4588, etc.)'
        println '2. This build expects mojang mappings (MinecraftClient, VertexConsumer, etc.)'
        println '3. Use TinyRemapper or similar tool to remap the source:'
        println '   java -jar tinyremapper.jar src/main/java remapped-src yarn-mappings.jar intermediary named'
        println '4. Then replace src/main/java with remapped-src'
    }
}