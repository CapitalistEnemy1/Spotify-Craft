plugins {
    id "net.fabricmc.fabric-loom" version "1.15.2"
    id "java"
}

group = "dev.neonlyrics"
version = "2.1.0+mc26.1.2"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

base {
    archivesName = "lyrics-cord"
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net" }
    maven { url "https://maven.neoforged.net/releases" }
    maven { url "https://jitpack.io" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.google.code.gson:gson:2.11.0"
    include "com.google.code.gson:gson:2.11.0"
}

loom {
    accessWidenerPath = file("neonlyrics.accesswidener")
    fabricModJsonPath = file("fabric.mod.json")
}

// Sources and game assets for this project don't follow Gradle's
// default src/main/java and src/main/resources layout: Java sources
// live directly under src/, and textures/lang/fonts live under
// assets/ at the project root. Minecraft's resource loader expects
// the "assets/" prefix to survive inside the jar (assets/<modid>/...),
// so the project root - not assets/ itself - is the resources
// source dir, filtered down to just the assets/ tree.
sourceSets {
    main {
        java {
            srcDirs = ["src"]
        }
        resources {
            srcDirs = [rootProject.projectDir]
            // assets/ is the game's texture/lang/font tree; the other
            // three are the mod's own metadata/mixin/access-widener
            // files, also kept at the project root rather than under
            // resources/. All need to land at the jar root so Fabric
            // Loader and Loom's nested-jar handling recognize the
            // output as a mod jar.
            include "assets/**"
            include "fabric.mod.json"
            include "neonlyrics.mixins.json"
            include "neonlyrics.accesswidener"
        }
    }
}

tasks.named("jar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            "Fabric-Mod-ID": "neonlyrics",
            "Fabric-Version": "1.0",
            "Mod-Name": "Lyrics Cord",
            "Mod-Version": version,
            "Mod-Author": "polishtraps85",
            "License": "MIT",
            "Main-Class": "dev.neonlyrics.NeonLyrics"
        )
    }
}
